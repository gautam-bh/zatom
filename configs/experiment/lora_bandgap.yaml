# @package _global_

# LoRA fine-tuning for band gap conditional crystal generation.
# Uses matbench_mp_gap (~106k MP structures with DFT band gaps).
#
# Usage:
#   python zatom/train_fm.py experiment=lora_bandgap ckpt_path=<pretrained_checkpoint>
#
# To target a different model size, override /model/architecture:
#   ... experiment=lora_bandgap model/architecture=tft_80M

defaults:
  - override /data: joint
  - override /model: zatom
  - override /model/architecture: tft_160M
  - override /callbacks: lora_bandgap
  - override /logger: wandb
  - override /strategy: optimized_ddp
  - override /trainer: ddp

name: "lora_bandgap_arch-${hydra:runtime.choices.model/architecture}"
task_name: finetune_fm

data:
  datamodule:
    datasets:
      mp20:
        proportion: 0.0
      qm9:
        proportion: 0.0
        global_property: null
      qmof150:
        proportion: 0.0
      omol25:
        proportion: 0.0
        global_energy: null
      geom:
        proportion: 0.0
      mptrj:
        proportion: 0.0
        global_energy: null
      matbench:
        proportion: 1.0
        global_property: matbench_mp_gap

model:
  # Train the band gap *conditioned generator*: optimize the flow-matching losses. With the
  # `finetune_fm` default (`aux_only`) the objective was just the aux band gap *prediction* head,
  # which left the 5 cross-attention decoder blocks' LoRA adapters out of the graph -- the DDP
  # unused-parameter crash in job 56923536 -- and would have taught the model to predict a band
  # gap it is already given as conditioning. Predicting band gaps is the eval pipeline's job.
  finetune_loss: generative
  architecture:
    lora_rank: 8
    lora_alpha: 8.0
    lora_target_modules: [q_proj, k_proj, v_proj, o_proj]
    band_gap_embedder:
      _target_: zatom.models.architectures.transformer.band_gap_embedder.BandGapEmbedder
      hidden_size: ${model.architecture.hidden_size}
      dropout_prob: 0.1
  augmentations:
    frac_coords: false
    # Left at the pretraining default of 8 deliberately -- see the OOM analysis below before
    # changing it. `training_step` replicates the batch `multiplicity` times per GPU BEFORE
    # the forward pass and gives each copy its own random rotation, so what attention
    # actually sees is
    #
    #   B_eff = batch_size x multiplicity
    #
    # and the two factors are interchangeable as far as memory is concerned. The dense
    # attention path materializes a [B_eff, H, L, L] fp32 score matrix -- `attention.py`
    # passes an explicit `attn_mask` to `scaled_dot_product_attention`, which disqualifies
    # the flash backend -- and autograd keeps it for the backward pass in all 16 layers:
    #
    #   32 x 8 = 256 graphs; 256 x 8 heads x 446^2 x 4 B = 1.52 GiB per layer
    #                                               (== the block the OOM asked for)
    #   x 16 layers x 2 (scores + softmax) ~= 48.6 GiB, before weights/grads/optimizer
    #
    # That is what OOM'd jobs 56547853, 56548543 and 56750303 on the first training batch.
    # The fix is to shrink `batch_size` rather than `multiplicity`: batch_size=8 with
    # multiplicity=8 gives the same B_eff=64 (~12 GiB) as batch_size=32 with multiplicity=2,
    # but keeps all 8 orientations per structure per step, which is the entire point of the
    # setting -- it buys SO(3) gradient-variance reduction, not data diversity. Raising
    # `accumulate_grad_batches` 4 -> 16 alongside it restores the original effective batch
    # of 4096, so optimizer-step semantics are unchanged.
    #
    # NOTE: in the current code L is fixed, not the batch's largest structure: `Zatom.forward`
    # pads every batch to `max_num_nodes`, the dataset's largest structure (444 atoms for
    # matbench_mp_gap), so attention memory per step depends on B_eff alone.
    # tests/predeploy/test_t1_memory.py checks this.
    multiplicity: 8
  sampling:
    n_jobs: 1
    num_samples: 10
    batch_size: 10
    cfg_scale: 3.0  # guidance scale; 1.0 = no guidance, higher = stronger band gap adherence

strategy:
  # Fail fast when a rank dies outside a collective: in job 56395971 rank 0 died on a W&B 401
  # and ranks 1-3 sat in ALLREDUCE for NCCL's default 30 minutes before aborting.
  timeout:
    _target_: datetime.timedelta
    minutes: 10

trainer:
  devices: 4
  num_nodes: 1
  max_epochs: 200
  max_time: "05:00:00:00"
  # The default trainer config validates every 50 epochs, which an 11-hour run never
  # reaches -- so `model_checkpoint` (monitoring `val_matbench/aux_global_property_loss`)
  # would never fire and W&B would log no validation metrics at all.
  check_val_every_n_epoch: 1
  # Was 2, to surface validation-loop errors in the first minute instead of after a full
  # epoch. Reverted to the repo default of 0 because the sanity check is scientifically
  # meaningless at step 0: `BandGapEmbedder` is randomly initialized, so it injects untrained
  # conditioning into the pretrained backbone and every sample comes back invalid. The val
  # loop here is also not a cheap loss pass but a full `CrystalGenerationEvaluator` sampling
  # run, so it is not free. `smoke_lora_bandgap.sh` covers the early-warning role: with
  # `limit_train_batches=16` it reaches the real val loop within ~2 minutes.
  #
  # NOTE: an earlier version of this comment blamed the sanity check for the OOMs in jobs
  # 56547853 / 56548543. That was wrong -- the tracebacks in all three failed smoke tests
  # (56547853, 56548543, 56750303) terminate in `training_step` -> `attention.py`, i.e. the
  # validation loop never ran. See `augmentations.multiplicity` below for the real cause.
  num_sanity_val_steps: 0
